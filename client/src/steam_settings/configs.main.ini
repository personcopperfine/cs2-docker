# GBE main configuration for CS2 (appid 730)
# Only non-default values are set; see /opt/gbe/steam_settings and the gbe_fork
# post_build docs for the full list of options.

[main::general]
# modern auth ticket format (required by current Source 2 games)
new_app_ticket=1
gc_token=1
# fail SteamNetworking cert requests locally instead of awaiting a server
# response (the game stalled forever on 'Retrying cert request' otherwise)
disable_networking=1
# we are a desktop install, not a Steam Deck / Proton session
steam_hardware_type=0
is_under_proton=0
